name: MultiPost AI Production Deploy
# Deploys to Cloudflare Workers on push to main

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: multipost-ai-production-${{ github.ref }}
  cancel-in-progress: true

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check Cloudflare credentials
        id: cloudflare
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${CLOUDFLARE_API_TOKEN:-}" && -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "available=true" >> "${GITHUB_OUTPUT}"
            echo "Cloudflare credentials available; production deployment enabled."
          else
            echo "available=false" >> "${GITHUB_OUTPUT}"
            echo "Cloudflare credentials not available; skipping deployment."
          fi

      - name: Install dependencies
        if: steps.cloudflare.outputs.available == 'true'
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Deploy to Cloudflare Workers
        if: steps.cloudflare.outputs.available == 'true'
        run: npx wrangler deploy --env production

      - name: Verify deployment
        if: steps.cloudflare.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo "Deployment successful!"
          echo "Live at: https://multipost-ai.vdldigital.com"

      - name: Deployment skipped
        if: steps.cloudflare.outputs.available != 'true'
        shell: bash
        run: |
          echo "⚠️  Deployment skipped - Cloudflare credentials not configured"
          echo "To enable: Add CLOUDFLARE_ACCOUNT_ID, CLOUDFLARE_API_TOKEN, and CLOUDFLARE_ZONE_ID to GitHub Secrets"
